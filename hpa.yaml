apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: koba-app-hpa
  labels:
    app: koba-app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: koba-app
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
