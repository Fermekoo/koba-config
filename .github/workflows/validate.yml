name: Validate Kubernetes Manifests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Kustomize Dry-Run Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: "v1.29.0"

      - name: Validate kustomize render
        run: |
          kubectl kustomize . > /tmp/rendered.yaml
          echo "Manifests rendered successfully"

      - name: Dry-run apply (client-side, no cluster needed)
        run: |
          kubectl apply --dry-run=client --validate=false -f /tmp/rendered.yaml
          echo "Dry-run apply passed"
