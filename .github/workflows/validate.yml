name: Validate Kubernetes Manifests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Kustomize Dry-Run Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: "v1.29.0"

      - name: Validate kustomize render
        run: |
          kubectl kustomize . > /tmp/rendered.yaml
          echo "Manifests rendered successfully"
          cat /tmp/rendered.yaml | grep -c "^kind:" | xargs -I{} echo "Resources rendered: {}"

      - name: Validate YAML syntax
        run: |
          python3 -c "
          import yaml, sys
          with open('/tmp/rendered.yaml') as f:
              docs = list(yaml.safe_load_all(f))
          print(f'Validated {len(docs)} Kubernetes resources')
          for doc in docs:
              print(f'  - {doc[\"kind\"]}/{doc[\"metadata\"][\"name\"]}')
          "
          echo "YAML validation passed"
