apiVersion: apps/v1
kind: Deployment
metadata:
  name: koba-app
  labels:
    app: koba-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: koba-app
  template:
    metadata:
      labels:
        app: koba-app
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
      containers:
        - name: app
          image: <AWS_ACCOUNT_ID>.dkr.ecr.<REGION>.amazonaws.com/koba-app:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: PORT
              value: "8080"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
